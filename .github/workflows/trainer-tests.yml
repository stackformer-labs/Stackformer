name: Trainer Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  trainer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,train]"
      - name: Record installed dependencies
        run: pip freeze > pip-freeze-${{ matrix.python-version }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pip-freeze-trainer-${{ matrix.python-version }}
          path: pip-freeze-${{ matrix.python-version }}.txt
          retention-days: 7
      - name: Run trainer tests
        run: pytest -q --maxfail=1 tests/trainer
